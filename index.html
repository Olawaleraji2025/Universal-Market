<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Market</title>

    <!-- Favicon using UM-logo -->
    <link rel="icon" type="image/png" href="/src/assets/logos/UM-logo2.png" />
    <link rel="apple-touch-icon" href="/src/assets/logos/UM-logo2.png" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="Universal Market — Quality Pre-Owned Gadgets &amp; Appliances" />
    <meta
      name="description"
      content="Ibadan's trusted marketplace for verified pre-owned laptops, smartphones, home appliances, and audio gear. Tested devices with direct WhatsApp support."
    />
    <meta name="theme-color" content="#064e3b" />

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Market" />
    <meta property="og:title" content="Universal Market — Quality Pre-Owned Gadgets &amp; Appliances" />
    <meta
      property="og:description"
      content="Ibadan's trusted marketplace for verified pre-owned laptops, smartphones, home appliances, and audio gear. Tested devices with direct WhatsApp support."
    />
    <!-- NOTE: When hosted, replace https://universal-market-delta.vercel.app/ with your actual live URL -->
    <meta property="og:url" content="https://universal-market-delta.vercel.app/" />
    <meta property="og:image" content="/src/assets/logos/UM-logo2.png" />
    <meta property="og:image:secure_url" content="/src/assets/logos/UM-logo2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Universal Market — Quality Pre-Owned Gadgets &amp; Appliances" />

    <!-- Twitter Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal Market — Quality Pre-Owned Gadgets &amp; Appliances" />
    <meta
      name="twitter:description"
      content="Ibadan's trusted marketplace for verified pre-owned laptops, smartphones, home appliances, and audio gear."
    />
    <meta name="twitter:image" content="/src/assets/logos/UM-logo2.png" />
